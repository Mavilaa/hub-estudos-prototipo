<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário acadêmico · Hub de Estudos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="calendario-academico.css">
</head>

<body>

    <!-- Cabeçalho com menu -->
    <header>
        <nav class="navbar navbar-expand-md border-bottom">
            <div class="container">
                <a class="navbar-brand logo" href="calendario-academico.html">Hub de Estudos</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Início</a></li>
                        <li class="nav-item"><a class="nav-link active" href="calendario-academico.html">Calendário</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-4">

        <h1 class="titulo-pagina">Calendário acadêmico</h1>
        <p class="text-secondary">Visão do mês e próximas entregas</p>

        <div class="row">

            <!-- Calendário do mês -->
            <section class="col-12 col-lg-8 mb-4">
                <div class="caixa">

                    <!-- 1) navegação do mês -->
                    <div class="topo-calendario">
                        <button id="btnAnterior" class="btn btn-outline-secondary btn-sm" title="Mês anterior">&lt;</button>
                        <h2 id="tituloMes" class="nome-mes"></h2>
                        <button id="btnProximo" class="btn btn-outline-secondary btn-sm" title="Próximo mês">&gt;</button>
                        <button id="btnHoje" class="btn btn-outline-secondary btn-sm">Hoje</button>
                    </div>

                    <div class="semana">
                        <div>dom</div>
                        <div>seg</div>
                        <div>ter</div>
                        <div>qua</div>
                        <div>qui</div>
                        <div>sex</div>
                        <div>sáb</div>
                    </div>

                    <!-- 4) grade do mês, montada pelo JavaScript -->
                    <div id="grade" class="grade"></div>

                    <!-- 6) legenda de cores das matérias -->
                    <div id="legenda" class="legenda"></div>
                </div>
            </section>

            <!-- 7) Próximas entregas -->
            <aside class="col-12 col-lg-4">
                <div class="caixa">
                    <h3 class="titulo-caixa">Próximas entregas</h3>
                    <ul id="proximas" class="lista-proximas"></ul>
                </div>

                <p id="mensagem" class="mensagem"></p>
            </aside>
        </div>
    </main>

    <footer class="rodape border-top">
        <div class="container">
            Hub de Estudos - Gustavo Martins de Ávila - PUC Minas
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="calendario-academico.js"></script>
</body>

</html>
