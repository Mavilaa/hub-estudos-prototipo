<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário - Hub de Estudos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <!-- Cabeçalho com menu -->
    <header>
        <nav class="navbar navbar-expand-md border-bottom">
            <div class="container">
                <a class="navbar-brand logo" href="#">Hub de Estudos</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="#">Início</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Estudos</a></li>
                        <li class="nav-item"><a class="nav-link active" href="calendario.html">Calendário</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Dúvidas</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Monitoria</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-4">

        <h1 class="titulo-pagina">Calendário</h1>
        <p class="text-secondary">Provas, trabalhos, tarefas e aulões do mês</p>

        <div class="row">

            <!-- Calendário do mês -->
            <section class="col-12 col-lg-8 mb-4">
                <div class="caixa">

                    <div class="topo-calendario">
                        <button id="btnAnterior" class="btn btn-outline-secondary btn-sm">&lt;</button>
                        <h2 id="tituloMes" class="nome-mes"></h2>
                        <button id="btnProximo" class="btn btn-outline-secondary btn-sm">&gt;</button>
                        <button id="btnHoje" class="btn btn-outline-secondary btn-sm">Hoje</button>

                        <select id="filtroMateria" class="form-select form-select-sm filtro">
                            <option value="todas">Todas as matérias</option>
                        </select>
                    </div>

                    <div class="semana">
                        <div>dom</div>
                        <div>seg</div>
                        <div>ter</div>
                        <div>qua</div>
                        <div>qui</div>
                        <div>sex</div>
                        <div>sáb</div>
                    </div>

                    <div id="grade" class="grade"></div>

                    <div id="legenda" class="legenda"></div>
                </div>
            </section>

            <!-- Eventos do dia e cadastro -->
            <aside class="col-12 col-lg-4">

                <div class="caixa mb-4">
                    <h3 id="tituloDia" class="titulo-caixa"></h3>
                    <div id="eventosDia"></div>
                </div>

                <div class="caixa">
                    <h3 id="tituloForm" class="titulo-caixa">Novo evento</h3>

                    <form id="formEvento">
                        <input type="hidden" id="eventoId">

                        <div class="mb-2">
                            <label for="titulo" class="form-label">Título</label>
                            <input type="text" id="titulo" class="form-control" placeholder="Ex.: Prova 2" required>
                        </div>

                        <div class="row">
                            <div class="col-6 mb-2">
                                <label for="materia" class="form-label">Matéria</label>
                                <select id="materia" class="form-select" required></select>
                            </div>
                            <div class="col-6 mb-2">
                                <label for="tipo" class="form-label">Tipo</label>
                                <select id="tipo" class="form-select">
                                    <option value="prova">Prova</option>
                                    <option value="trabalho">Trabalho</option>
                                    <option value="tarefa">Tarefa</option>
                                    <option value="quiz">Quiz</option>
                                    <option value="aulao">Aulão</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-6 mb-2">
                                <label for="data" class="form-label">Data</label>
                                <input type="date" id="data" class="form-control" required>
                            </div>
                            <div class="col-6 mb-2">
                                <label for="hora" class="form-label">Hora</label>
                                <input type="time" id="hora" class="form-control">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="sala" class="form-label">Sala (opcional)</label>
                            <input type="text" id="sala" class="form-control" placeholder="Ex.: 310">
                        </div>

                        <button type="submit" id="btnSalvar" class="btn btn-success">Salvar evento</button>
                        <button type="button" id="btnLimpar" class="btn btn-outline-secondary">Limpar</button>
                    </form>

                    <p id="mensagem" class="mensagem"></p>
                </div>

            </aside>
        </div>
    </main>

    <footer class="rodape border-top">
        <div class="container">
            Hub de Estudos - Gustavo Martins - PUC Minas
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
</body>

</html>
